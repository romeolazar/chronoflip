<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">ChronoFlip</title>
  <desc id="description">Two dark flip-clock cards showing the letters C and F.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#303033"/>
      <stop offset="0.49" stop-color="#222225"/>
      <stop offset="0.51" stop-color="#18181a"/>
      <stop offset="1" stop-color="#29292c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#000"/>
  <rect x="20" y="20" width="472" height="472" rx="70" fill="none" stroke="#242426" stroke-width="16"/>
  <g>
    <rect x="60" y="96" width="176" height="320" rx="26" fill="url(#card)" stroke="#3b3b3e" stroke-width="6"/>
    <rect x="276" y="96" width="176" height="320" rx="26" fill="url(#card)" stroke="#3b3b3e" stroke-width="6"/>
    <text x="148" y="329" fill="#f7f7f5" font-family="Arial, Helvetica, sans-serif" font-size="212" font-weight="700" text-anchor="middle">C</text>
    <text x="364" y="329" fill="#f7f7f5" font-family="Arial, Helvetica, sans-serif" font-size="212" font-weight="700" text-anchor="middle">F</text>
    <path d="M66 256h164M282 256h164" stroke="#050506" stroke-width="12"/>
    <path d="M68 248h160M284 248h160" stroke="#4a4a4e" stroke-width="3" opacity=".7"/>
    <circle cx="68" cy="256" r="6" fill="#77777b"/>
    <circle cx="228" cy="256" r="6" fill="#77777b"/>
    <circle cx="284" cy="256" r="6" fill="#77777b"/>
    <circle cx="444" cy="256" r="6" fill="#77777b"/>
  </g>
</svg>
