services:
  dashboard:
    build: .
    container_name: chronoflip
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./calendar:/data/calendar:ro
      - chronoflip-settings:/data/settings
    environment:
      PORT: 8080
      SETTINGS_FILE: "${SETTINGS_FILE:-/data/settings/settings.json}"
      LOCATION_NAME: "${LOCATION_NAME:-Timisoara, Romania}"
      LATITUDE: "${LATITUDE:-45.7489}"
      LONGITUDE: "${LONGITUDE:-21.2087}"
      TEMPERATURE_UNIT: "${TEMPERATURE_UNIT:-celsius}"
      WIND_SPEED_UNIT: "${WIND_SPEED_UNIT:-kmh}"
      SHOW_SECONDS: "${SHOW_SECONDS:-false}"
      BLINK_SEPARATOR: "${BLINK_SEPARATOR:-true}"
      CLOCK_POSITION: "${CLOCK_POSITION:-center}"
      LOCALE: "${LOCALE:-en-GB}"
      TIME_ZONE: "${TIME_ZONE:-Europe/Bucharest}"
      FORECAST_DAYS: "${FORECAST_DAYS:-5}"
      CALENDAR_ICS_URL: "${CALENDAR_ICS_URL:-http://better-f1-calendar.vercel.app/api/calendar.ics}"
      CALENDAR_ICS_FILE: "${CALENDAR_ICS_FILE:-/data/calendar/calendar.ics}"
      CALENDAR_DAYS: "${CALENDAR_DAYS:-7}"
      CALENDAR_MAX_EVENTS: "${CALENDAR_MAX_EVENTS:-4}"
      DIM_START: "${DIM_START:-22}"
      DIM_END: "${DIM_END:-7}"
      DIM_LEVEL: "${DIM_LEVEL:-0.72}"
      SLEEP_ENABLED: "${SLEEP_ENABLED:-false}"
      SLEEP_START: "${SLEEP_START:-23:00}"
      SLEEP_END: "${SLEEP_END:-07:00}"
      SLEEP_DAYS: "${SLEEP_DAYS:-0,1,2,3,4,5,6}"
      SLEEP_DIM_LEVEL: "${SLEEP_DIM_LEVEL:-0.20}"
      SLEEP_SHOW_SECONDS: "${SLEEP_SHOW_SECONDS:-false}"
      BURN_IN_SHIFT: "${BURN_IN_SHIFT:-true}"

volumes:
  chronoflip-settings:
